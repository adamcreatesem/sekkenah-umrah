<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rebuilt from the client's own lockup: navy disc, gold ring, white mihrab holding a
       mosque, crescent above it, and the two ribbons leaving the badge at the foot.
       The ribbons are masked to the outside of the disc, which is how they read in the
       original: wings behind the badge, not a line drawn across it. -->
  <defs>
    <mask id="outside">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="30" r="27" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#outside)" fill="none" stroke="#c9a45c" stroke-width="2.6" stroke-linecap="round">
    <path d="M2.5 44.4c7.6 5.4 15.6 7.4 24 7.6"/>
    <path d="M61.5 44.4c-7.6 5.4-15.6 7.4-24 7.6"/>
  </g>

  <circle cx="32" cy="30" r="27" fill="#0d3e5c"/>
  <circle cx="32" cy="30" r="27" fill="none" stroke="#c9a45c" stroke-width="1.6"/>
  <circle cx="32" cy="30" r="23" fill="none" stroke="#f4efe4" stroke-width=".55" opacity=".26"/>

  <!-- crescent -->
  <path d="M35.4 13.9a4.5 4.5 0 1 0 0 8.6 5.6 5.6 0 1 1 0-8.6Z" fill="#e8d3a6"/>

  <!-- mihrab: white field, navy edge -->
  <path d="M22.9 54V39.2c0-5 3.3-8.6 9.1-12.7 5.8 4.1 9.1 7.7 9.1 12.7V54Z"
        fill="#f4efe4" stroke="#0d3e5c" stroke-width="1"/>
  <!-- mosque -->
  <path d="M27.5 46.2a4.5 4.5 0 0 1 9 0V54h-9Z" fill="#c9a45c"/>
  <path d="M29.4 54v-4.4a1.8 1.8 0 0 1 3.5 0V54" fill="#0d3e5c"/>
  <rect x="24.8" y="37.6" width="1.5" height="16.4" rx=".75" fill="#0d3e5c"/>
  <path d="M24.8 37.6a1.5 1.5 0 0 1 1.5-1.5 1.5 1.5 0 0 1 1.5 1.5Z" fill="#0d3e5c"/>
  <circle cx="25.55" cy="35.7" r=".85" fill="#c9a45c"/>
  <rect x="37.7" y="42" width="1.1" height="12" rx=".55" fill="#0d3e5c"/>
  <path d="M37.7 42a1.1 1.1 0 0 1 2.2 0Z" fill="#0d3e5c"/>
</svg>
